<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Полка Lostinvain</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Полка Lostinvain</h1>
    <p class="subtitle">Коллекция моих любимых игр · <span id="card-count" aria-live="polite">0 игр</span></p>
  </header>

  <main>
    <!-- Форма добавления и редактирования игры. В режиме правки скрытое поле
         index хранит позицию карточки на полке -->
    <form class="add-form" id="add-form" aria-label="Добавить игру">
      <h2 class="add-form__title" id="form-title">Добавить игру</h2>
      <input type="hidden" name="index" value="">
      <input name="title" type="text" required maxlength="80" placeholder="Название" aria-label="Название">
      <input name="caption" type="text" maxlength="120" placeholder="Студия · Жанр, год" aria-label="Подпись">
      <input name="cover" type="text" maxlength="8" placeholder="🎮" aria-label="Обложка-эмодзи">
      <input name="coverUrl" type="url" maxlength="2000" placeholder="Ссылка на обложку (необязательно)" aria-label="Ссылка на обложку">
      <input name="tags" type="text" maxlength="120" placeholder="Теги через запятую" aria-label="Теги">
      <button type="submit" id="submit-btn">Добавить</button>
      <button type="button" id="cancel-edit" hidden>Отмена</button>
    </form>

    <!-- Поиск по названию: карточки фильтруются по мере ввода -->
    <div class="search">
      <input id="search-input" type="search" placeholder="Поиск по названию" aria-label="Поиск по названию" autocomplete="off">
      <button type="button" id="reset-filters" hidden>Сбросить</button>
    </div>

    <!-- Фильтр по тегу: чипы рисуются скриптом по тегам всех карточек -->
    <div class="tag-filter" id="tag-filter" role="group" aria-label="Фильтр по тегам"></div>

    <!-- Карточки рисуются скриптом из localStorage -->
    <section class="shelf" aria-label="Игры"></section>
    <p class="shelf-empty" id="shelf-empty" hidden>Ничего не найдено</p>
  </main>

  <footer class="site-footer">
    <p>Полка Lostinvain</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
