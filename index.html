<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Полка Lostinvain</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Игровая полка Lostinvain</h1>
    <p class="subtitle">Коллекция моих игр · <span id="card-count" aria-live="polite">0 игр</span></p>
  </header>

  <main>
    <!-- Вкладки: «Играл» со всеми играми, «Любимые» (отмеченные сердечком) и тирлист.
         Активная вкладка хранится в localStorage под ключом shelf-tab, переключение — в app.js -->
    <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы">
      <button type="button" role="tab" data-tab="favorite" aria-selected="false">Любимые</button>
      <button type="button" role="tab" data-tab="played" aria-selected="true">Играл</button>
      <button type="button" role="tab" data-tab="tierlist" aria-selected="false">Тирлист</button>
    </nav>

    <!-- Всё, что относится к коллекциям карточек: форма, поиск, фильтры, полка.
         На вкладке «Тирлист» этот блок скрыт -->
    <div class="collection-view" id="collection-view">
    <!-- Форма добавления и редактирования игры. В режиме правки скрытое поле
         index хранит позицию карточки на полке -->
    <form class="add-form" id="add-form" aria-label="Добавить игру">
      <h2 class="add-form__title" id="form-title">Добавить игру</h2>
      <input type="hidden" name="index" value="">
      <input name="title" type="text" required maxlength="80" placeholder="Название" aria-label="Название">
      <input name="caption" type="text" maxlength="120" placeholder="Студия · Жанр, год" aria-label="Подпись">
      <input name="cover" type="text" maxlength="8" placeholder="🎮" aria-label="Обложка-эмодзи">
      <input name="coverUrl" type="url" maxlength="2000" placeholder="Ссылка на обложку (необязательно)" aria-label="Ссылка на обложку">
      <input name="tags" type="text" maxlength="120" placeholder="Теги через запятую" aria-label="Теги">
      <button type="submit" id="submit-btn">Добавить</button>
      <button type="button" id="cancel-edit" hidden>Отмена</button>
    </form>

    <!-- Поиск по названию: карточки фильтруются по мере ввода -->
    <div class="search">
      <input id="search-input" type="search" placeholder="Поиск по названию" aria-label="Поиск по названию" autocomplete="off">
      <button type="button" id="reset-filters" hidden>Сбросить</button>
    </div>

    <!-- Фильтр по тегу: чипы рисуются скриптом по тегам всех карточек -->
    <div class="tag-filter" id="tag-filter" role="group" aria-label="Фильтр по тегам"></div>

    <!-- Панель полки: сортировка (app.js) и экспорт коллекции (export.js) -->
    <div class="shelf-toolbar">
      <label class="sort-control">
        Сортировка
        <select id="sort-select" aria-label="Сортировка карточек">
          <option value="added">Как добавлены</option>
          <option value="title">По названию</option>
          <option value="year">По году</option>
        </select>
      </label>
      <button type="button" id="export-btn">Экспорт в JSON</button>
    </div>

    <!-- Карточки рисуются скриптом из localStorage -->
    <section class="shelf" aria-label="Игры"></section>
    <p class="shelf-empty" id="shelf-empty" hidden>Ничего не найдено</p>
    </div>

    <!-- Тирлист: обложки всех карточек раскладываются по рядам перетаскиванием.
         Содержимое рисует tierlist.js, показывается на вкладке «Тирлист» -->
    <section class="tierlist" id="tierlist" aria-label="Тирлист" hidden></section>
  </main>

  <!-- Диалог мнения об игре: открывается кликом по карточке (notes.js).
       Название подставляется скриптом, мнения лежат в localStorage под ключом shelf-notes -->
  <dialog class="note-dialog" id="note-dialog" aria-labelledby="note-dialog-title">
    <form class="note-form" method="dialog">
      <h2 class="note-dialog__title" id="note-dialog-title">Мнение об игре</h2>
      <textarea id="note-text" name="note" maxlength="500" rows="6" placeholder="Что думаете об этой игре?" aria-label="Мнение об игре"></textarea>
      <div class="note-dialog__actions">
        <button type="submit" id="note-save">Сохранить</button>
        <button type="button" id="note-delete" hidden>Удалить</button>
        <button type="button" id="note-cancel">Отмена</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <p>Полка Lostinvain</p>
  </footer>

  <script src="app.js"></script>
  <script src="export.js"></script>
  <script src="tierlist.js"></script>
  <script src="notes.js"></script>
</body>
</html>
